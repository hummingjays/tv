<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>90s Sony Trinitron CRT TV Simulator - ARchives</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Retro Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=VT323&family=Press+Start+2P&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        vt323: ['VT323', 'monospace'],
                        arcade: ['"Press Start 2P"', 'cursive'],
                        mono: ['"Share Tech Mono"', 'monospace']
                    },
                    colors: {
                        crtGreen: '#00ff66',
                        crtAmber: '#ffb000',
                        trinitronDark: '#1a1a1e',
                        trinitronGrey: '#25252a',
                        trinitronAccent: '#8a8a92'
                    }
                }
            }
        }
    </script>

    <style>
        /* Ambient Dark Room Background */
        body {
            background-color: #030305;
            background-image: 
                radial-gradient(circle at 50% 35%, #181824 0%, #08080c 60%, #020203 100%),
                radial-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 0);
            background-size: 100% 100%, 32px 32px;
            user-select: none;
            -webkit-user-select: none;
        }

        /* Sony Trinitron Outer Bezel Chassis */
        .trinitron-chassis {
            background: linear-gradient(180deg, #222228 0%, #141418 40%, #0c0c0f 100%);
            border: 10px solid #111114;
            border-radius: 28px;
            box-shadow: 
                inset 0 1px 2px rgba(255, 255, 255, 0.1),
                inset 0 -4px 8px rgba(0,0,0,0.9),
                0 30px 80px rgba(0, 0, 0, 0.98),
                0 0 40px rgba(0, 255, 102, 0.03);
            position: relative;
        }

        /* Metallic Top Accent Line */
        .trinitron-stripe {
            height: 3px;
            background: linear-gradient(90deg, #0d0d0f, #555560 20%, #aaaaaa 50%, #555560 80%, #0d0d0f);
            opacity: 0.9;
        }

        /* Curved CRT Tube Frame */
        .crt-screen-wrapper {
            position: relative;
            background: #000;
            border-radius: 24px / 20px;
            overflow: hidden;
            box-shadow: inset 0 0 80px rgba(0, 0, 0, 1);
        }

        .aspect-4-3 { aspect-ratio: 4 / 3; }

        /* Scanline Overlay & Aperture Grille */
        .scanlines-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(
                rgba(18, 16, 16, 0) 50%,
                rgba(0, 0, 0, 0.45) 50%
            );
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 20;
            opacity: 0.85;
        }

        .aperture-grille-mesh {
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, rgba(255,0,0,0.035), rgba(0,255,0,0.035), rgba(0,0,255,0.035));
            background-size: 3px 100%;
            pointer-events: none;
            z-index: 19;
        }

        .crt-glare {
            position: absolute;
            inset: 0;
            background: linear-gradient(
                130deg,
                rgba(255, 255, 255, 0.08) 0%,
                rgba(255, 255, 255, 0.015) 28%,
                rgba(0, 0, 0, 0) 60%,
                rgba(255, 255, 255, 0.03) 100%
            );
            pointer-events: none;
            z-index: 22;
            border-radius: inherit;
        }

        .crt-vignette {
            position: absolute;
            inset: 0;
            box-shadow: inset 0 0 90px rgba(0,0,0,0.95);
            pointer-events: none;
            z-index: 21;
        }

        .osd-glow {
            color: #00ff66;
            text-shadow: 0 0 6px rgba(0, 255, 102, 0.9), 0 0 12px rgba(0, 255, 102, 0.4);
        }

        /* Power off line collapse animation */
        @keyframes powerOffCollapse {
            0% { transform: scale(1, 1); opacity: 1; filter: brightness(1); }
            40% { transform: scale(1, 0.005); opacity: 1; filter: brightness(3); background-color: #fff; }
            70% { transform: scale(0.005, 0.005); opacity: 1; filter: brightness(5); background-color: #fff; }
            100% { transform: scale(0, 0); opacity: 0; filter: brightness(10); background-color: #fff; }
        }
        .power-off-anim {
            animation: powerOffCollapse 0.4s cubic-bezier(0.25, 1, 0.5, 1) forwards !important;
        }
        .power-on-anim {
            animation: powerOffCollapse 0.4s cubic-bezier(0.25, 1, 0.5, 1) reverse forwards !important;
        }

        /* Channel change CRT warp effect */
        @keyframes channelWarp {
            0% { transform: scale(1); filter: brightness(1) contrast(1) sepia(0); }
            10% { transform: scale(1.02) skewX(2deg); filter: brightness(2) contrast(1.5) sepia(1); }
            20% { transform: scale(0.98) skewX(-2deg); filter: brightness(0.5) contrast(2); }
            30% { transform: scale(1.01) skewY(1deg); filter: brightness(1.5); }
            100% { transform: scale(1); filter: brightness(1) contrast(1) sepia(0); }
        }
        .channel-warp-anim {
            animation: channelWarp 0.4s ease-out forwards;
        }

        /* Custom Amber Thumb Range Slider (Seekbar) */
        input[type=range].retro-seekbar {
            -webkit-appearance: none;
            appearance: none;
            background: transparent;
            width: 100%;
        }

        input[type=range].retro-seekbar:focus {
            outline: none;
        }

        input[type=range].retro-seekbar::-webkit-slider-runnable-track {
            width: 100%;
            height: 6px;
            cursor: pointer;
            background: #2a2a30;
            border-radius: 3px;
            border: 1px solid #141418;
        }

        input[type=range].retro-seekbar::-webkit-slider-thumb {
            height: 16px;
            width: 16px;
            border-radius: 50%;
            background: #ffb000;
            cursor: pointer;
            -webkit-appearance: none;
            margin-top: -5px;
            box-shadow: 0 0 10px #ffb000, 0 0 2px #ffffff;
            transition: transform 0.1s ease;
        }

        input[type=range].retro-seekbar::-webkit-slider-thumb:hover {
            transform: scale(1.25);
        }

        input[type=range].retro-seekbar::-moz-range-track {
            width: 100%;
            height: 6px;
            cursor: pointer;
            background: #2a2a30;
            border-radius: 3px;
            border: 1px solid #141418;
        }

        input[type=range].retro-seekbar::-moz-range-thumb {
            height: 16px;
            width: 16px;
            border-radius: 50%;
            background: #ffb000;
            cursor: pointer;
            box-shadow: 0 0 10px #ffb000, 0 0 2px #ffffff;
        }

        /* Tactile Remote & Chassis Buttons */
        .remote-btn {
            background: linear-gradient(145deg, #2a2a30, #18181c);
            box-shadow: 0 4px 0 #0d0d10, 0 5px 8px rgba(0,0,0,0.8);
            transition: all 0.08s ease;
        }
        .remote-btn:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #0d0d10, 0 2px 4px rgba(0,0,0,0.8);
        }

        .remote-btn-red {
            background: linear-gradient(145deg, #be123c, #881337);
            box-shadow: 0 4px 0 #4c0519, 0 5px 8px rgba(0,0,0,0.8);
        }
        .remote-btn-red:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #4c0519, 0 2px 4px rgba(0,0,0,0.8);
        }

        .remote-btn-blue {
            background: linear-gradient(145deg, #1d4ed8, #1e40af);
            box-shadow: 0 4px 0 #1e3a8a, 0 5px 8px rgba(0,0,0,0.8);
        }
        .remote-btn-blue:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #1e3a8a, 0 2px 4px rgba(0,0,0,0.8);
        }

        .tv-tac-btn {
            background: linear-gradient(180deg, #2f2f36, #16161a);
            border: 1px solid #3d3d46;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.1), 0 2px 4px rgba(0,0,0,0.9);
        }
        .tv-tac-btn:active {
            background: #111114;
            transform: translateY(1px);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0a0a0c; }
        ::-webkit-scrollbar-thumb { background: #22222a; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #00ff66; }
    </style>
</head>
<body class="text-gray-200 min-h-screen flex flex-col justify-between font-mono selection:bg-crtGreen selection:text-black antialiased">

                    </div>

                </div>

                <!-- TV BEZEL PLAYBACK CONTROL BAR & SEEKBAR -->
                <div class="mt-4 p-3 bg-neutral-950/90 border border-neutral-800/80 rounded-xl shadow-inner flex flex-col justify-center gap-2">
                    <div class="flex items-center space-x-3 w-full">

                        <!-- Elapsed Time -->
                        <span id="currentTimeText" class="font-mono text-xs text-amber-400/90 tracking-wider shrink-0 font-bold min-w-[45px]">00:00</span>

                        <!-- Duration Time -->

                <!-- Lower Chassis Controls Row (Balanced & Perfectly Spaced Groups) -->

                            <i class="fa-solid fa-power-off"></i>
                        </button>
                        <button id="cabShuffleBtn" class="tv-tac-btn px-2 sm:px-3 py-1.5 rounded text-emerald-400 font-mono text-[9px] sm:text-[11px] font-bold tracking-wider shrink-0">

                    <!-- Right Group: Channel Up/Down -->

                            <i class="fa-solid fa-chevron-down"></i>
                        </button>
                        <button id="cabChUp" class="tv-tac-btn px-3 py-1.5 rounded text-neutral-300 text-xs shrink-0">
                            <i class="fa-solid fa-chevron-up"></i>

                    </div>
                </div>

            </div>
        </div>

        <!-- Handheld Remote Control Panel (RM-V980 COMMANDER) -->
        <div class="w-full sm:w-72 bg-neutral-950 border-4 border-neutral-900 rounded-[36px] p-5 shadow-2xl flex flex-col justify-between items-center space-y-4 border-b-8">
            
            <!-- Remote Branding (Synchronized with Top-of-TV Arcade Font Style and Updated Subtext) -->
            <div class="w-full text-center border-b border-neutral-900 pb-2">
                <span class="text-neutral-500 font-arcade text-[8px] tracking-[0.2em] font-bold opacity-90 block">AR-chives</span>
                <span class="text-[8px] text-neutral-500 font-arcade tracking-wider uppercase block mt-1 scale-90">built by SenthilKumar</span>
            </div>

            <!-- Row 1: Power & Mute -->
            <div class="w-full grid grid-cols-2 gap-3">
                <button id="remPower" class="remote-btn remote-btn-red p-3 rounded-2xl flex flex-col items-center justify-center text-white">

                </button>
                <button id="remMute" class="remote-btn p-3 rounded-2xl flex flex-col items-center justify-center text-neutral-300">
                    <i id="remMuteIcon" class="fa-solid fa-volume-high text-base"></i>

                    <span class="text-xs font-bold font-mono">-30s</span>

                <button id="remSkipFwd" class="remote-btn p-3 rounded-xl flex items-center justify-center space-x-2 text-amber-400">

                    <span class="text-[9px] text-neutral-400 font-bold tracking-wider">VOL</span>
                    <button id="remVolUp" class="remote-btn w-full py-2.5 rounded-xl flex items-center justify-center text-neutral-200">
                        <i class="fa-solid fa-plus text-xs"></i>
                    </button>
                    <button id="remVolDown" class="remote-btn w-full py-2.5 rounded-xl flex items-center justify-center text-neutral-200">
                        <i class="fa-solid fa-minus text-xs"></i>

                    <span class="text-[9px] text-neutral-400 font-bold tracking-wider">CH</span>

                    </button>

            </div>

            <!-- Row 4: Dedicated Aspect Ratio Button -->
            <div class="w-full">
                <button id="remAspect" class="remote-btn w-full py-2.5 rounded-xl text-xs font-bold text-cyan-400 flex items-center justify-center space-x-2">

                    <span>ASPECT RATIO</span>

            </div>

            <!-- Row 5: Utility Buttons (Scanlines & TV Guide) -->
            <div class="w-full space-y-2.5">
                <button id="remScanlines" class="remote-btn w-full py-2.5 rounded-xl text-xs font-bold text-amber-400 flex items-center justify-center space-x-2">
                    <i class="fa-solid fa-grip-lines text-xs"></i>
                    <span>SCANLINES</span>

                <button id="remEpg" class="remote-btn remote-btn-blue w-full py-3 rounded-xl text-xs font-bold text-white flex items-center justify-center space-x-2">

                    <span>TV GUIDE (EPG)</span>

            </div>

        </div>

    </main>

    <!-- TV Guide EPG Modal -->
    <div id="epgModal" class="fixed inset-0 z-50 bg-black/90 backdrop-blur-md hidden flex items-center justify-center p-4">
        <div class="bg-neutral-950 border-2 border-crtGreen/50 w-full max-w-4xl rounded-2xl shadow-2xl overflow-hidden flex flex-col max-h-[85vh]">
            <div class="bg-neutral-900 px-6 py-4 border-b border-neutral-800 flex justify-between items-center">

                    <i class="fa-solid fa-tv text-crtGreen text-xl"></i>
                    <div>

                </div>

            </div>

            <div class="p-4 flex-1 overflow-y-auto space-y-2" id="epgList"></div>
        </div>
    </div>

    <script>
        // Obfuscated Base64 Encoded Source Endpoints
        const _a1 = 'aHR0cHM6Ly9hcmNoaXZlLm9yZy9tZXRhZGF0YS9BUlJNb3ZpZXM=';
        const _a2 = 'aHR0cHM6Ly9hcmNoaXZlLm9yZy9kb3dubG9hZC9BUlJNb3ZpZXMv';

        const METADATA_ENDPOINT = atob(_a1);
        const STREAM_BASE_URL = atob(_a2);

        let channels = [];
        // Default to a random initial channel index if not previously stored
        let currentChannelIndex = localStorage.getItem('tvChannelIndex') !== null ? parseInt(localStorage.getItem('tvChannelIndex')) : Math.floor(Math.random() * 3);
        let channelTimes = JSON.parse(localStorage.getItem('tvChannelTimes')) || {};
        let isPowerOn = false;
        let isMuted = false;
        let isSeeking = false;
        let currentVolume = 0.8;
        let scanlinesEnabled = true;

        // Aspect ratios: object-fill (DEFAULT), object-contain (4:3), zoom (object-cover)
        const aspectModes = [
            { label: 'FILL (STRETCH)', class: 'object-fill' },
            { label: '4:3 PILLARBOX', class: 'object-contain' },
            { label: 'ZOOM (CROP)', class: 'object-cover' }
        ];
        let currentAspectIndex = 0;

        const tvPlayer = document.getElementById('tvPlayer');
        const crtDisplay = document.getElementById('crtDisplay');
        const staticCanvas = document.getElementById('staticCanvas');
        const powerOffScreen = document.getElementById('powerOffScreen');
        const powerLed = document.getElementById('powerLed');
        const unmutePrompt = document.getElementById('unmutePrompt');
        
        const seekBar = document.getElementById('seekBar');
        const currentTimeText = document.getElementById('currentTimeText');
        const durationText = document.getElementById('durationText');
        const bezPlayBtn = document.getElementById('bezPlayBtn');
        const bezPlayIcon = document.getElementById('bezPlayIcon');

        const osd = document.getElementById('osd');
        const osdChannel = document.getElementById('osdChannel');
        const osdInput = document.getElementById('osdInput');
        const osdTitle = document.getElementById('osdTitle');
        const osdVolume = document.getElementById('osdVolume');
        const volBars = document.getElementById('volBars');
        const scanlinesOverlay = document.querySelector('.scanlines-overlay');

        let osdTimeout, osdVolTimeout, staticAnimId;

        // Persistent memory auto-save loop
        setInterval(() => {
            if (isPowerOn && tvPlayer.readyState > 0 && !tvPlayer.paused) {
                channelTimes[currentChannelIndex] = tvPlayer.currentTime;
                localStorage.setItem('tvChannelTimes', JSON.stringify(channelTimes));
            }
        }, 2000);

        const FALLBACK_MOVIES = [
            { name: "Big Buck Bunny", streamUrl: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4", duration: 596 },
            { name: "Elephants Dream", streamUrl: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ElephantsDream.mp4", duration: 653 },
            { name: "Sintel Sci-Fi Reel", streamUrl: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/Sintel.mp4", duration: 888 }
        ];

        function formatTime(seconds) {
            if (isNaN(seconds) || seconds < 0) return "00:00";
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins < 10 ? '0' : ''}${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }

        async function loadCatalog() {
            try {
                const res = await fetch(METADATA_ENDPOINT);
                const data = await res.json();
                if (data && data.files) {
                    const videoFiles = data.files.filter(f => f.name.endsWith('.mp4') || f.name.endsWith('.webm'));
                    if (videoFiles.length > 0) {
                        channels = videoFiles.map((file, idx) => ({
                            ch: idx + 1,
                            title: file.title || file.name.replace(/\.[^/.]+$/, "").replace(/_/g, " "),
                            streamUrl: STREAM_BASE_URL + encodeURIComponent(file.name),
                            duration: file.length ? parseFloat(file.length) : 3600
                        }));
                    }
                }
            } catch (e) {
                console.warn('Using fallback movie catalog:', e);
            }

            if (channels.length === 0) {
                channels = FALLBACK_MOVIES.map((item, idx) => ({
                    ch: idx + 1,
                    title: item.name,
                    streamUrl: item.streamUrl,
                    duration: item.duration
                }));
            }
            
            // If no stored channel index existed, pick a random valid channel index upon loading catalog
            if (localStorage.getItem('tvChannelIndex') === null && channels.length > 0) {
                currentChannelIndex = Math.floor(Math.random() * channels.length);
            }
            renderEPG();
        }

        function triggerStatic(durationMs = 350) {
            staticCanvas.classList.remove('hidden');
            const ctx = staticCanvas.getContext('2d');
            
            function drawNoise() {
                if (staticCanvas.classList.contains('hidden')) return;
                const w = staticCanvas.width = staticCanvas.clientWidth / 2;
                const h = staticCanvas.height = staticCanvas.clientHeight / 2;
                const imgData = ctx.createImageData(w, h);
                const buffer = new Uint32Array(imgData.data.buffer);
                for (let i = 0; i < buffer.length; i++) {
                    const gray = Math.floor(Math.random() * 255);
                    buffer[i] = (255 << 24) | (gray << 16) | (gray << 8) | gray;
                }
                ctx.putImageData(imgData, 0, 0);
                staticAnimId = requestAnimationFrame(drawNoise);
            }

            cancelAnimationFrame(staticAnimId);
            drawNoise();
            setTimeout(() => {
                staticCanvas.classList.add('hidden');
                cancelAnimationFrame(staticAnimId);
            }, durationMs);
        }

        function switchChannel(index, isRandom = false, randomJump = false) {
            if (!isPowerOn || channels.length === 0) return;
            
            // Save current time before switching
            if (tvPlayer.readyState > 0) {
                channelTimes[currentChannelIndex] = tvPlayer.currentTime;
                localStorage.setItem('tvChannelTimes', JSON.stringify(channelTimes));
            }

            // Apply CRT warp effect
            tvPlayer.classList.remove('channel-warp-anim');
            void tvPlayer.offsetWidth; // trigger reflow
            tvPlayer.classList.add('channel-warp-anim');

            if (isRandom) {
                index = Math.floor(Math.random() * channels.length);
            } else {
                if (index < 0) index = channels.length - 1;
                if (index >= channels.length) index = 0;
            }

            currentChannelIndex = index;
            localStorage.setItem('tvChannelIndex', currentChannelIndex);
            
            const ch = channels[currentChannelIndex];
            
            osdChannel.textContent = `CH ${ch.ch < 10 ? '0' + ch.ch : ch.ch}`;
            osdInput.textContent = aspectModes[currentAspectIndex].label;
            osdTitle.textContent = `Now Showing : ${ch.title}`;
            osd.classList.remove('opacity-0');
            clearTimeout(osdTimeout);
            osdTimeout = setTimeout(() => osd.classList.add('opacity-0'), 3000);

            triggerStatic(380);

            tvPlayer.src = ch.streamUrl;
            tvPlayer.load();

            tvPlayer.onloadedmetadata = () => {
                const dur = tvPlayer.duration || ch.duration;
                durationText.textContent = formatTime(dur);
                seekBar.max = dur;
                
                // Requirement 2: Instant randomized timestamp in track (or explicit channel tuning jump)
                let jumpTime = 0;
                if (randomJump) {
                    // Pick a random timestamp between 5% and 85% of the video duration to ensure valid content
                    const minTime = dur * 0.05;
                    const maxTime = dur * 0.85;
                    jumpTime = minTime + Math.random() * (maxTime - minTime);
                } else if (channelTimes[currentChannelIndex]) {
                    jumpTime = channelTimes[currentChannelIndex];
                }
                tvPlayer.currentTime = jumpTime;
                
                tvPlayer.muted = isMuted;
                tvPlayer.volume = currentVolume;
                tvPlayer.play().catch(() => {
                    tvPlayer.muted = true;
                    tvPlayer.play();
                });
            };
        }

        function togglePower() {
            isPowerOn = !isPowerOn;
            if (isPowerOn) {
                unmutePrompt.classList.add('hidden');
                powerOffScreen.classList.add('hidden');
                crtDisplay.classList.remove('power-off-anim');
                crtDisplay.classList.add('power-on-anim');
                powerLed.className = "w-2.5 h-2.5 rounded-full bg-red-600 inline-block shadow-[0_0_10px_rgba(220,38,38,0.95)] animate-pulse";
                
                // When first turning on the TV, if no saved playback timestamp exists for this channel, 
                // start with a random channel and a randomized scene/timestamp.
                const hasSavedTime = channelTimes[currentChannelIndex] !== undefined && channelTimes[currentChannelIndex] > 0;
                if (!hasSavedTime) {
                    const randomIdx = channels.length > 0 ? Math.floor(Math.random() * channels.length) : currentChannelIndex;
                    switchChannel(randomIdx, false, true);
                } else {
                    switchChannel(currentChannelIndex);
                }
            } else {
                // Save current time
                if (tvPlayer.readyState > 0) {
                    channelTimes[currentChannelIndex] = tvPlayer.currentTime;
                    localStorage.setItem('tvChannelTimes', JSON.stringify(channelTimes));
                }

                // CRT squish collapse effect
                crtDisplay.classList.remove('power-on-anim');
                crtDisplay.classList.remove('power-off-anim');
                void crtDisplay.offsetWidth; // Reflow
                crtDisplay.classList.add('power-off-anim');
                
                powerLed.className = "w-2.5 h-2.5 rounded-full bg-neutral-900 inline-block";
                tvPlayer.pause();
                staticCanvas.classList.add('hidden');
                
                setTimeout(() => {
                    powerOffScreen.classList.remove('hidden');
                }, 400);
            }
        }

        function togglePlayPause() {
            if (!isPowerOn) return;
            if (tvPlayer.paused) {
                tvPlayer.play();
                bezPlayIcon.className = "fa-solid fa-pause text-xs";
            } else {
                tvPlayer.pause();
                bezPlayIcon.className = "fa-solid fa-play text-xs";
            }
        }

        function skipTime(seconds) {
            if (!isPowerOn || !tvPlayer.duration) return;
            tvPlayer.currentTime = Math.min(tvPlayer.duration, Math.max(0, tvPlayer.currentTime + seconds));
        }

        function setVolume(delta) {
            if (!isPowerOn) return;
            currentVolume = Math.min(1, Math.max(0, currentVolume + delta));
            tvPlayer.volume = currentVolume;
            if (currentVolume > 0 && isMuted) {
                isMuted = false;
                tvPlayer.muted = false;
            }
            showVolumeOSD();
        }

        function toggleMute() {
            if (!isPowerOn) return;
            isMuted = !isMuted;
            tvPlayer.muted = isMuted;
            document.getElementById('remMuteIcon').className = isMuted 
                ? "fa-solid fa-volume-xmark text-red-500 text-base" 
                : "fa-solid fa-volume-high text-base";
            showVolumeOSD();
        }

        function showVolumeOSD() {
            volBars.innerHTML = '';
            const activeBars = isMuted ? 0 : Math.round(currentVolume * 10);
            for (let i = 0; i < 10; i++) {
                const bar = document.createElement('div');
                bar.className = `flex-1 h-full rounded-sm ${i < activeBars ? 'bg-crtGreen' : 'bg-neutral-800'}`;
                volBars.appendChild(bar);
            }
            osdVolume.classList.remove('opacity-0');
            clearTimeout(osdVolTimeout);
            osdVolTimeout = setTimeout(() => osdVolume.classList.add('opacity-0'), 2000);
        }

        function cycleAspectRatio() {
            if (!isPowerOn) return;
            currentAspectIndex = (currentAspectIndex + 1) % aspectModes.length;
            const mode = aspectModes[currentAspectIndex];
            
            tvPlayer.classList.remove('object-fill', 'object-contain', 'object-cover');
            tvPlayer.classList.add(mode.class);

            osdInput.textContent = mode.label;
            osd.classList.remove('opacity-0');
            clearTimeout(osdTimeout);
            osdTimeout = setTimeout(() => osd.classList.add('opacity-0'), 2500);
        }

        function toggleScanlines() {
            if (!isPowerOn) return;
            scanlinesEnabled = !scanlinesEnabled;
            scanlinesOverlay.style.display = scanlinesEnabled ? 'block' : 'none';
        }

        function renderEPG() {
            const epgList = document.getElementById('epgList');
            epgList.innerHTML = '';
            channels.forEach((ch, idx) => {
                const item = document.createElement('div');
                item.className = "p-3 rounded-xl bg-neutral-900 hover:bg-neutral-850 border border-neutral-800 flex items-center justify-between cursor-pointer";
                item.innerHTML = `
                    <div class="flex items-center space-x-3">
                        <span class="font-vt323 text-xl px-2 py-0.5 rounded bg-neutral-800 text-crtGreen border border-crtGreen/30">CH ${ch.ch < 10 ? '0' + ch.ch : ch.ch}</span>
                        <span class="font-bold text-sm text-neutral-200">${ch.title}</span>
                    </div>
                    <span class="text-xs text-neutral-500 font-mono">TUNE IN</span>
                `;
                item.addEventListener('click', () => {
                    if (!isPowerOn) togglePower();
                    else switchChannel(idx, false, true); // Randomize timestamp on EPG channel select
                    document.getElementById('epgModal').classList.add('hidden');
                });
                epgList.appendChild(item);
            });
        }

        function setupListeners() {
            // Disable right-click & context menus across the document
            document.addEventListener('contextmenu', (e) => e.preventDefault());

            unmutePrompt.addEventListener('click', () => { if (!isPowerOn) togglePower(); });
            document.getElementById('cabPowerBtn').addEventListener('click', togglePower);
            document.getElementById('remPower').addEventListener('click', togglePower);
            
            bezPlayBtn.addEventListener('click', togglePlayPause);

            seekBar.addEventListener('input', () => {
                isSeeking = true;
                currentTimeText.textContent = formatTime(seekBar.value);
            });

            seekBar.addEventListener('change', () => {
                if (tvPlayer.duration) {
                    tvPlayer.currentTime = seekBar.value;
                }
                isSeeking = false;
            });

            tvPlayer.addEventListener('timeupdate', () => {
                if (!isSeeking && tvPlayer.duration) {
                    seekBar.value = tvPlayer.currentTime;
                    currentTimeText.textContent = formatTime(tvPlayer.currentTime);
                    durationText.textContent = formatTime(tvPlayer.duration);
                }
            });

            tvPlayer.addEventListener('play', () => { bezPlayIcon.className = "fa-solid fa-pause text-xs"; });
            tvPlayer.addEventListener('pause', () => { bezPlayIcon.className = "fa-solid fa-play text-xs"; });

            document.getElementById('remSkipBack').addEventListener('click', () => skipTime(-30));
            document.getElementById('remSkipFwd').addEventListener('click', () => skipTime(30));

            // Requirement 2: Channel changes & Shuffle jump to randomized timestamp
            document.getElementById('cabChUp').addEventListener('click', () => switchChannel(currentChannelIndex + 1, false, true));
            document.getElementById('cabChDown').addEventListener('click', () => switchChannel(currentChannelIndex - 1, false, true));
            document.getElementById('remChUp').addEventListener('click', () => switchChannel(currentChannelIndex + 1, false, true));
            document.getElementById('remChDown').addEventListener('click', () => switchChannel(currentChannelIndex - 1, false, true));

            document.getElementById('remVolUp').addEventListener('click', () => setVolume(0.1));
            document.getElementById('remVolDown').addEventListener('click', () => setVolume(-0.1));
            document.getElementById('remMute').addEventListener('click', toggleMute);

            document.getElementById('remAspect').addEventListener('click', cycleAspectRatio);

            document.getElementById('remScanlines').addEventListener('click', toggleScanlines);

            // Chassis Shuffle & Volume controls
            document.getElementById('cabShuffleBtn').addEventListener('click', () => switchChannel(0, true, true));
            document.getElementById('cabVolUp').addEventListener('click', () => setVolume(0.1));
            document.getElementById('cabVolDown').addEventListener('click', () => setVolume(-0.1));

            const epgModal = document.getElementById('epgModal');
            document.getElementById('remEpg').addEventListener('click', () => {
                if(isPowerOn) epgModal.classList.remove('hidden');
            });
            document.getElementById('closeEpgBtn').addEventListener('click', () => epgModal.classList.add('hidden'));
        }

        window.onload = () => {
            setupListeners();
            loadCatalog();
        };
    </script>
</body>
</html>
